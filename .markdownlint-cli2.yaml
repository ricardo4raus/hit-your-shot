# Markdown lint rules for docs. Kept loose: the docs are read by people and AI assistants, not rendered as a site.
config:
  default: true
  MD013: false # line length: long table rows and prose lines are fine
  MD024: # duplicate headings are fine in different sections (e.g. "Why" under several items)
    siblings_only: true
  MD033: false # inline HTML (rare, for details blocks)
  MD036: false # emphasis used as a label
  MD041: false # first line need not be a top heading (front matter, notes)
ignores:
  - node_modules
  - .claude
